<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Old Vehicle Sale</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fc;
      margin: 0;
      padding: 0;
    }

    .contact-container {
      max-width: 1100px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .contact-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .contact-header h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #333;
    }

    .contact-header p {
      color: #666;
      font-size: 1rem;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .contact-info {
      background: #f9fafc;
      padding: 20px;
      border-radius: 10px;
    }

    .contact-info h2 {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: #444;
    }

    .info-item {
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .info-item i {
      color: #007BFF;
      font-size: 1.2rem;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }

    .contact-form textarea {
      resize: none;
      height: 120px;
    }

    .contact-form button {
      background: #007BFF;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s ease;
    }

    .contact-form button:hover {
      background: #0056b3;
    }

    @media (max-width: 768px) {
      .contact-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="contact-container">
    <div class="contact-header">
      <h1>Contact Us</h1>
      <p>We’d love to hear from you! Reach out with questions, suggestions, or feedback.</p>
    </div>

    <div class="contact-grid">
      <!-- Left: Contact Info -->
      <div class="contact-info">
        <h2>Our Office</h2>
        <div class="info-item">
          <i class="fas fa-map-marker-alt"></i>
          <span>123 MG Road, Mumbai, India</span>
        </div>
        <div class="info-item">
          <i class="fas fa-phone"></i>
          <span>+91 98765 43210</span>
        </div>
        <div class="info-item">
          <i class="fas fa-envelope"></i>
          <span>support@oldvehiclesale.com</span>
        </div>
        <div class="info-item">
          <i class="fas fa-clock"></i>
          <span>Mon - Sat: 9:00 AM - 7:00 PM</span>
        </div>
      </div>

      <!-- Right: Contact Form -->
      <div class="contact-form">
        <form>
          <input type="text" name="name" placeholder="Your Name" required>
          <input type="email" name="email" placeholder="Your Email" required>
          <input type="text" name="subject" placeholder="Subject" required>
          <textarea name="message" placeholder="Your Message" required></textarea>
          <button type="submit">Send Message</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
